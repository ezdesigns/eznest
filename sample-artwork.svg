    <path id="CutContour_Kiss-cut" d="M0 10L20 0H86Q96 0 96 10V16H74V27H57V40H26Q18 40 16 34L13 24H0Z" fill="#536ab0" stroke="#dd38b8" stroke-width="0.15"/>
    <path d="M5 12L24 4H86L73 12H48L22 34L18 23H5Z" fill="#dbe4e0"/>
    <path d="M31 33L50 17H67V23H51L39 34Z" fill="#efb66a"/>
    <path d="M56 7H78M48 11H68" stroke="#536ab0" stroke-width="1.2"/>
  </g>
  <g id="small-label" data-name="Swept visor accent" transform="translate(148 111) rotate(-8 42 15)">
    <path id="EZN_BOUNDARY_accent" d="M0 14Q18 0 42 3L79 0Q86 0 84 7L76 17L55 20Q47 13 39 21L12 28Q1 30 0 22Z" fill="#d8c86e" stroke="#dd38b8" stroke-width="0.15"/>
    <path d="M7 16Q24 7 41 10L73 6L68 11L43 15Q30 11 11 22Z" fill="#254b50"/>
    <path d="M16 18L28 14M54 9L64 8" stroke="#f4edcf" stroke-width="1.2"/>
