<svg xmlns="http://www.w3.org/2000/svg" width="260mm" height="180mm" viewBox="0 0 260 180">
  <title>Trail graphics — curved four-piece decal kit</title>
  <desc>Original demonstration artwork in millimeters: a recessed side fairing, helmet crest, stepped guard and curved accent. Each complete part has one closed outer boundary.</desc>
  <defs>
    <clipPath id="panel-clip"><path d="M0 12Q0 0 14 0H84Q104 0 108 14L100 28H66Q58 28 58 36V48L34 62H8Q0 62 0 54V42H20Q30 42 30 32V25H0Z"/></clipPath>
    <linearGradient id="panel-ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173d41"/><stop offset="1" stop-color="#4d9985"/></linearGradient>
    <linearGradient id="crest-ink" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#efae61"/><stop offset="1" stop-color="#cc653d"/></linearGradient>
  </defs>
  <g id="clipped-panel" data-name="Recessed side fairing" transform="translate(12 16)" clip-path="url(#panel-clip)">
    <rect x="-2" y="-2" width="114" height="68" fill="url(#panel-ink)"/>
    <path d="M-10 58L70 -10H88L8 68ZM20 68L110 -9V9L42 68Z" fill="#e5edbc"/>
    <path d="M-8 47L57 -8M44 69L115 8" fill="none" stroke="#eeb66e" stroke-width="2"/>
    <path d="M8 10H38M8 15H27M72 18H94" fill="none" stroke="#d3e3d8" stroke-width="1.2"/>
    <path d="M0 12Q0 0 14 0H84Q104 0 108 14L100 28H66Q58 28 58 36V48L34 62H8Q0 62 0 54V42H20Q30 42 30 32V25H0Z" fill="none" stroke="#dd38b8" stroke-width="0.15"/>
  </g>
  <g id="rounded-badge" data-name="Helmet crest" transform="translate(154 12)">
    <path id="EZN_BOUNDARY_badge" d="M4 13Q0 4 12 2L30 0Q34 12 38 0L58 2Q72 4 68 16L61 29L70 38Q62 55 35 66Q8 55 0 38L9 29Z" fill="url(#crest-ink)" stroke="#dd38b8" stroke-width="0.15"/>
    <path d="M12 17L29 10L35 22L42 10L58 17L51 28L59 38Q48 50 35 56Q22 50 11 38L19 28Z" fill="#253f44"/>
    <circle cx="35" cy="35" r="12" fill="#e9deb1"/>
    <path d="M25 39L33 29L37 34L42 27L48 39Z" fill="#376e67"/>
    <path d="M27 44H43" stroke="#d67b45" stroke-width="1.5"/>
  </g>
