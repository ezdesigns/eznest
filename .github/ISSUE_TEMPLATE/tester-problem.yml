name: Tester problem
description: A job would not import, nest, export, update, or open in ONYX.
title: "Problem in Ez Nest"
body:
  - type: input
    id: version
    attributes:
      label: Ez Nest version
      description: Shown in What's new. Example 0.12.0-beta.1
      placeholder: 0.12.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: file_type
    attributes:
      label: Artwork
      options:
        - PDF
        - AI
        - SVG
        - Update or startup
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you clicked and the exact words on screen. Do not attach customer artwork unless Ezven asks for it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: textarea
    id: onyx
    attributes:
      label: ONYX or GoProduce
      description: Did the file open, print, or cut? If ONYX rejected a cut, include the spot or layer name it showed.
    validations:
      required: false
