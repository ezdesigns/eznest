name: Tester problem
description: A job would not import, nest, send, update, or open in ONYX.
title: "Problem in eznest"
body:
  - type: input
    id: version
    attributes:
      label: eznest version
      description: Shown in the gear. Example 1.0.0-rc.1
      placeholder: 1.0.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: file_type
    attributes:
      label: Artwork
      options:
        - PDF
        - AI
        - SVG
        - Update or startup
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you clicked and the exact words on screen. Do not attach customer artwork unless Ezven asks for it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: textarea
    id: onyx
    attributes:
      label: ONYX or hot folder
      description: The cut name ONYX showed, or the hot-folder path with the customer job name removed.
    validations:
      required: false
