name: Tester note
description: A comparison result, a suggestion, or something that worked.
title: "Tester note"
body:
  - type: input
    id: version
    attributes:
      label: Ez Nest version
      placeholder: 0.12.0-beta.1
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
      description: For an MX comparison, include the job name, material width, lengths, time, and whether ONYX accepted the file. Leave customer art out.
    validations:
      required: true
