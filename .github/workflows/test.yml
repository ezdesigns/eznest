name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Python 3.12 / Node 24
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install engine dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Python engine and API
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check interface syntax
        run: node --check queue-app.js
      - name: Test queue and physical units
        run: node tests/test_queue.cjs
      - name: Test shop profiles
        run: node tests/test_shop_profiles.cjs
      - name: Test legacy boundary policy
        run: node tests/test_boundaries.cjs
