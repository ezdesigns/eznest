name: Windows OUTPUT acceptance
# QA-only dispatch override. Never merge this diagnostic branch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent:
    if: github.repository == 'ezdesigns/eznest' && github.ref == 'refs/heads/codex/rc8-consent-probe'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'playwright==1.64.1'
      - name: Run the exact consent UI test with bounded synthetic failure evidence
        run: python tests/diagnose_rc8_consent.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc8-consent-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/rc8-consent-probe
          if-no-files-found: warn
          retention-days: 7
