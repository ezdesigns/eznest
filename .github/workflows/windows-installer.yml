name: Windows installer

# CI produces unsigned test installers and never reads publisher credentials.
# version.json is the only version number. build_windows.py passes it to Inno Setup.
# A v* tag attaches eznest-setup.exe to that GitHub release.
# workflow_dispatch uploads the same exe as an artifact and does not publish a release.
# pull_request runs the build on this branch before the file is on the default branch.
# GitHub hides workflow_dispatch until the workflow is on the default branch or has run once.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build eznest-setup.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install the build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $isccDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $iscc = Join-Path $isccDir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC missing after install (expected $iscc)" }
          Add-Content -Path $env:GITHUB_PATH -Value $isccDir

      - name: Build the shop installer
        shell: pwsh
        env:
          EZ_NEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python build_windows.py --out (Join-Path $env:RUNNER_TEMP "eznest-build")
          $setup = "installer\Output\eznest-setup.exe"
          $pin = "installer\Output\BUILD.json"
          if (-not (Test-Path $setup)) { throw "eznest-setup.exe was not produced" }
          if (-not (Test-Path $pin)) { throw "BUILD.json was not produced" }
          Get-Item $setup | Select-Object FullName, Length
          Get-Content $pin
          $expected = (Get-Content $pin -Raw | ConvertFrom-Json).sha256
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "BUILD.json sha256 does not match eznest-setup.exe" }

      - name: Write the checksum from version.json
        shell: pwsh
        env:
          EZ_NEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $setup = "installer\Output\eznest-setup.exe"
          $pin = "installer\Output\BUILD.json"
          $version = (Get-Content -Raw version.json | ConvertFrom-Json).version
          python installer_update.py --write-sidecars $setup "installer\Output" $version
          python -c "import json, os; from pathlib import Path; import build_windows; version=json.loads(Path('version.json').read_text(encoding='utf-8'))['version']; build_windows.write_release_pin(Path(r'installer/Output/BUILD.json'), version, os.environ.get('EZ_NEST_COMMIT',''), Path(r'installer/Output/eznest-setup.exe'))"
          $expected = (Get-Content $pin -Raw | ConvertFrom-Json).sha256
          $sidecar = (Get-Content "installer\Output\eznest-setup.exe.sha256" -Raw).Split()[0].ToLower()
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual -or $sidecar -ne $actual) { throw "Checksum does not match eznest-setup.exe" }
          if ((Get-Content $pin -Raw | ConvertFrom-Json).version -ne $version) { throw "BUILD.json version does not match version.json" }

      - name: Test actual fresh install on disposable Windows runner
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_installed_shop.ps1

      - name: Upload the installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: eznest-setup
          path: |
            installer/Output/eznest-setup.exe
            installer/Output/eznest-setup.exe.sha256
            installer/Output/BUILD.json
            installer/Output/manifest.json
          if-no-files-found: error

  tester:
    name: Install and exercise the separate Windows tester
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build and browser test dependencies
        run: python -m pip install -r requirements-build.txt playwright
      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed" }
          $isccDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path (Join-Path $isccDir "ISCC.exe"))) { throw "ISCC missing after install" }
          Add-Content -Path $env:GITHUB_PATH -Value $isccDir
      - name: Build the per-user tester installer
        shell: pwsh
        run: |
          $buildId = "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          $build = Join-Path $env:RUNNER_TEMP "eznest-tester-build"
          $trial = Join-Path $env:RUNNER_TEMP "eznest-tester-package"
          $output = Join-Path $env:RUNNER_TEMP "eznest-tester-installer"
          New-Item -ItemType Directory -Path $output | Out-Null
          python build_windows.py --portable-only --out $build
          if ($LASTEXITCODE -ne 0) { throw "Portable build failed" }
          python build_shop_trial.py --app (Join-Path $build "dist\eznest") --out $trial --build-id $buildId
          if ($LASTEXITCODE -ne 0) { throw "Tester packaging failed" }
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          & ISCC.exe "/DSourceDir=$trial" "/DMyAppVersion=$version" "/DBuildId=$buildId" "/O$output" installer/tester.iss
          if ($LASTEXITCODE -ne 0) { throw "Tester installer compilation failed" }
          $setup = Join-Path $output "EZ-Nest-Tester-$buildId-Setup.exe"
          $hash = (Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant()
          ($hash + '  ' + (Split-Path -Leaf $setup)) | Set-Content -LiteralPath ($setup + '.sha256') -Encoding utf8
          Copy-Item -LiteralPath (Join-Path $trial 'BUILD.json') -Destination $output
          "TESTER_BUILD_ID=$buildId" | Add-Content $env:GITHUB_ENV
          "TESTER_SETUP=$setup" | Add-Content $env:GITHUB_ENV
          "TESTER_PACKAGE=$trial" | Add-Content $env:GITHUB_ENV
      - name: Test actual tester install on this clean disposable runner
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/test_installed_tester.ps1 -Setup $env:TESTER_SETUP -TrialPackage $env:TESTER_PACKAGE -BuildId $env:TESTER_BUILD_ID -ReportDir (Join-Path $env:RUNNER_TEMP "eznest-tester-acceptance")
          if ($LASTEXITCODE -ne 0) { throw "Tester acceptance failed; inspect the uploaded logs" }
      - name: Upload tester installer and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eznest-tester-and-acceptance
          path: |
            ${{ runner.temp }}/eznest-tester-installer/*
            ${{ runner.temp }}/eznest-tester-acceptance/*
          if-no-files-found: warn

  publish:
    name: Publish approved tag build
    needs: installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: eznest-release
    permissions:
      contents: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: eznest-setup
          path: installer/Output

      - name: Attach the installer to the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = "installer\Output\eznest-setup.exe"
          $pin = "installer\Output\BUILD.json"
          $sha = "installer\Output\eznest-setup.exe.sha256"
          $manifest = "installer\Output\manifest.json"
          $notes = "Shop server installer for $tag. Run eznest-setup.exe on the shop PC. It does not need Python or Git. BUILD.json records the version, commit, and SHA-256 of eznest-setup.exe. eznest-setup.exe.sha256 is the checksum Update checks."
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $pin $sha $manifest --clobber
          } else {
            gh release create $tag $setup $pin $sha $manifest --title $tag --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


