name: Windows installer

# A v* tag attaches eznest-setup.exe to that GitHub release.
# workflow_dispatch uploads the same exe as an artifact and does not publish a release.
# pull_request runs the build on this branch before the file is on the default branch.
# GitHub hides workflow_dispatch until the workflow is on the default branch or has run once.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build eznest-setup.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install the build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $isccDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $iscc = Join-Path $isccDir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC missing after install (expected $iscc)" }
          Add-Content -Path $env:GITHUB_PATH -Value $isccDir

      - name: Build the shop installer
        shell: pwsh
        env:
          EZ_NEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python build_windows.py --out (Join-Path $env:RUNNER_TEMP "eznest-build")
          $setup = "installer\Output\eznest-setup.exe"
          $pin = "installer\Output\BUILD.json"
          if (-not (Test-Path $setup)) { throw "eznest-setup.exe was not produced" }
          if (-not (Test-Path $pin)) { throw "BUILD.json was not produced" }
          Get-Item $setup | Select-Object FullName, Length
          Get-Content $pin
          $expected = (Get-Content $pin -Raw | ConvertFrom-Json).sha256
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "BUILD.json sha256 does not match eznest-setup.exe" }

      - name: Upload the installer artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: eznest-setup
          path: |
            installer/Output/eznest-setup.exe
            installer/Output/BUILD.json
          if-no-files-found: error

      - name: Attach the installer to the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = "installer\Output\eznest-setup.exe"
          $pin = "installer\Output\BUILD.json"
          $notes = "Shop server installer for $tag. Run eznest-setup.exe on the shop PC. It does not need Python or Git. BUILD.json records the version, commit, and SHA-256 of eznest-setup.exe."
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $pin --clobber
          } else {
            gh release create $tag $setup $pin --title $tag --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
