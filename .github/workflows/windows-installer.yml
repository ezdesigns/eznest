name: Windows installer

# CI produces unsigned test installers and never reads publisher credentials.
# version.json is the only version number. build_windows.py passes it to Inno Setup.
# Release publication is owned by auto-release.yml after both platforms pass.
# workflow_dispatch uploads the same exe as an artifact and does not publish a release.
# pull_request runs the build on this branch before the file is on the default branch.
# GitHub hides workflow_dispatch until the workflow is on the default branch or has run once.
on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Checked main commit selected by the release planner'
        required: true
        type: string
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build eznest-setup.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install the build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $pinnedDir = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6.7.3"
          $start = New-Object System.Diagnostics.ProcessStartInfo
          $start.FileName = $installer
          $start.Arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /PORTABLE=1 /DIR=""$pinnedDir"""
          $start.UseShellExecute = $true
          $process = [System.Diagnostics.Process]::Start($start)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "Inno Setup 6.7.3 installer failed with exit code $($process.ExitCode)" }
          $candidates = @(
            (Join-Path $pinnedDir "ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6.7.3\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $previousNative = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          $chosen = $null
          $reports = New-Object System.Collections.Generic.List[string]
          try {
            foreach ($candidate in $candidates) {
              if (-not (Test-Path -LiteralPath $candidate)) { continue }
              $help = & $candidate '/?' 2>&1 | Out-String
              $engine = '' | & $candidate '/O-' '-' 2>&1 | Out-String
              $reported = "$help`n$engine"
              $reports.Add("$candidate`n$reported")
              if ($reported -match 'Inno Setup 6\.7\.3(\D|$)') {
                $chosen = $candidate
                break
              }
            }
          } finally {
            $PSNativeCommandUseErrorActionPreference = $previousNative
          }
          if (-not $chosen) {
            throw "Inno Setup 6.7.3 is not present after install. Expected ISCC under '$pinnedDir'. Compiler output:`n$($reports -join "`n---`n")"
          }
          $isccDir = Split-Path -Parent $chosen
          Add-Content -Path $env:GITHUB_PATH -Value $isccDir
          "EZ_NEST_ISCC=$chosen" | Add-Content -Path $env:GITHUB_ENV
          Write-Output "Inno Setup 6.7.3 verified: $chosen"
          exit 0

      - name: Build the shop installer
        shell: pwsh
        env:
          EZ_NEST_COMMIT: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          python build_windows.py --out (Join-Path $env:RUNNER_TEMP "eznest-build")
          $setup = "installer\Output\eznest-setup.exe"
          $pin = "installer\Output\BUILD.json"
          if (-not (Test-Path $setup)) { throw "eznest-setup.exe was not produced" }
          if (-not (Test-Path $pin)) { throw "BUILD.json was not produced" }
          Get-Item $setup | Select-Object FullName, Length
          Get-Content $pin
          $expected = (Get-Content $pin -Raw | ConvertFrom-Json).sha256
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "BUILD.json sha256 does not match eznest-setup.exe" }

      - name: Write the checksum from version.json
        shell: pwsh
        env:
          EZ_NEST_COMMIT: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          $setup = "installer\Output\eznest-setup.exe"
          $pin = "installer\Output\BUILD.json"
          $version = (Get-Content -Raw version.json | ConvertFrom-Json).version
          python installer_update.py --write-sidecars $setup "installer\Output" $version
          python -c "import json, os; from pathlib import Path; import build_windows; version=json.loads(Path('version.json').read_text(encoding='utf-8'))['version']; build_windows.write_release_pin(Path(r'installer/Output/BUILD.json'), version, os.environ.get('EZ_NEST_COMMIT',''), Path(r'installer/Output/eznest-setup.exe'))"
          $expected = (Get-Content $pin -Raw | ConvertFrom-Json).sha256
          $sidecar = (Get-Content "installer\Output\eznest-setup.exe.sha256" -Raw).Split()[0].ToLower()
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual -or $sidecar -ne $actual) { throw "Checksum does not match eznest-setup.exe" }
          if ((Get-Content $pin -Raw | ConvertFrom-Json).version -ne $version) { throw "BUILD.json version does not match version.json" }

      - name: Upload the installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eznest-setup
          path: |
            installer/Output/eznest-setup.exe
            installer/Output/eznest-setup.exe.sha256
            installer/Output/BUILD.json
            installer/Output/manifest.json
          if-no-files-found: error

      - name: Test actual fresh install on disposable Windows runner
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_installed_shop.ps1

