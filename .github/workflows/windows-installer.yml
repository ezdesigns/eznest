name: Windows installer

# Pull requests and a manual run upload eznest-setup.exe, its SHA-256, and an
# unpublished manifest. They do not publish a release.
# A v* tag, or a manual run with publish_release, waits for the eznest-release
# environment and then attaches those files to a GitHub release.
# GitHub hides workflow_dispatch until the workflow is on the default branch or has run once.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release. Requires approval in the eznest-release environment.
        type: boolean
        default: false
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build eznest-setup.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install the build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $isccDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $iscc = Join-Path $isccDir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC missing after install (expected $iscc)" }
          Add-Content -Path $env:GITHUB_PATH -Value $isccDir

      - name: Build the shop installer
        shell: pwsh
        env:
          EZ_NEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python build_windows.py --out (Join-Path $env:RUNNER_TEMP "eznest-build")
          $setup = "installer\Output\eznest-setup.exe"
          $pin = "installer\Output\BUILD.json"
          if (-not (Test-Path $setup)) { throw "eznest-setup.exe was not produced" }
          if (-not (Test-Path $pin)) { throw "BUILD.json was not produced" }
          Get-Item $setup | Select-Object FullName, Length
          Get-Content $pin
          $expected = (Get-Content $pin -Raw | ConvertFrom-Json).sha256
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "BUILD.json sha256 does not match eznest-setup.exe" }
          $artifact = Join-Path $env:RUNNER_TEMP "artifact"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          Copy-Item $setup $artifact
          Copy-Item $pin $artifact
          $version = (Get-Content -Raw version.json | ConvertFrom-Json).version
          python installer_update.py --write-sidecars (Join-Path $artifact "eznest-setup.exe") $artifact $version
          Get-ChildItem $artifact | Select-Object Name, Length

      - name: Upload the installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: eznest-setup
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error

  publish:
    name: Publish approved release
    needs: installer
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    environment: eznest-release
    permissions:
      contents: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: eznest-setup
          path: dist

      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('dist/manifest.json').read_text())
          version = manifest['version']
          filename = manifest['filename']
          ref = os.environ.get('GITHUB_REF', '')
          tag = os.environ.get('GITHUB_REF_NAME', '')
          if not ref.startswith('refs/tags/v'):
              tag = 'v' + version
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{filename}"
          manifest['published'] = True
          manifest['url'] = url
          manifest['approval'] = 'Published after the eznest-release environment approved this workflow.'
          Path('dist/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          Path('dist/release-tag').write_text(tag + '\n')
          Path('dist/notes.md').write_text(f"Shop server installer for {tag}. Run eznest-setup.exe on the shop PC. The SHA-256 file is the checksum Update checks before it installs.\n")
          PY
          tag=$(cat dist/release-tag)
          gh release view "$tag" && exists=1 || exists=0
          if [ "$exists" = "1" ]; then
            gh release upload "$tag" dist/eznest-setup.exe dist/eznest-setup.exe.sha256 dist/manifest.json dist/BUILD.json --clobber
          else
            gh release create "$tag" dist/eznest-setup.exe dist/eznest-setup.exe.sha256 dist/manifest.json dist/BUILD.json --title "$tag" --notes-file dist/notes.md --prerelease
          fi
