name: Automatic dual-platform release

on:
  pull_request:
    paths:
      - '.github/workflows/auto-release.yml'
      - '.github/workflows/windows-installer.yml'
      - 'tools/auto_release.py'
      - 'tools/macos_release.py'
      - 'tests/test_auto_release.py'
      - 'tests/test_published_macos.py'
      - 'tests/macos_svg_acceptance.py'
  workflow_run:
    workflows: [Tests]
    branches: [main]
    types: [completed]

permissions:
  contents: read

# Never interrupt publication. Stale CI is rejected again before publication.
concurrency:
  group: eznest-automatic-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_auto_release.py
      - run: python -m py_compile tools/auto_release.py tools/macos_release.py tests/test_published_macos.py

  plan:
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'ezdesigns/eznest' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/auto_release.py plan

  windows:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/windows-installer.yml
    with:
      source_sha: ${{ needs.plan.outputs.sha }}

  macos:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: macos-26
    environment: eznest-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Require protected signing configuration
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: python tools/macos_release.py preflight
      # Dependency installation and runtime acceptance receive no signing secrets.
      - run: python -m pip install -r requirements-build.txt 'playwright==1.64.1'
      - name: Sign, notarize and staple the app and package
        id: package
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}/eznest-pyinstaller
        run: python tools/macos_release.py build --out "$RUNNER_TEMP/eznest-release-macos"
      - name: Install the exact signed candidate on the disposable VM
        env:
          EZ_NEST_PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: python tests/test_published_macos.py Install
      - name: Verify local SVG, PDF, restart persistence and disabled sharing
        run: python tests/test_published_macos.py Offline
      - name: Clean up only this VM's owned installation
        if: always()
        run: python tests/test_published_macos.py Cleanup
      - name: Finalize platform acceptance receipt
        run: python tools/macos_release.py finalize --out "$RUNNER_TEMP/eznest-release-macos"
      - name: Upload checked Mac package
        uses: actions/upload-artifact@v4
        with:
          name: eznest-macos-arm64
          path: |
            ${{ runner.temp }}/eznest-release-macos/eznest-shop-arm64-${{ needs.plan.outputs.version }}.pkg
            ${{ runner.temp }}/eznest-release-macos/eznest-shop-arm64-${{ needs.plan.outputs.version }}.pkg.sha256
            ${{ runner.temp }}/eznest-release-macos/MACOS-RELEASE.json
          if-no-files-found: error

  publish:
    needs: [plan, windows, macos]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: eznest-release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: eznest-setup
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: eznest-macos-arm64
          path: release-assets/macos
      - name: Verify both platform receipts and publish without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/auto_release.py publish --assets release-assets
