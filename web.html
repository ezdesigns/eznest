<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eznest</title>
<link rel="stylesheet" href="/web.css">
</head>
<body data-step="drop">
<details id="settings">
  <summary aria-label="Settings">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 3.2v2.2M12 18.6V21M3.2 12h2.2M18.6 12H21M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6"/>
    </svg>
  </summary>
  <div class="panel">
    <div class="fields">
      <label>Preset name
        <input id="preset-name" type="text" maxlength="80" value="Vinyl + gloss lam">
      </label>
      <label>Roll width
        <span class="measure"><input id="width" type="number" min="0" step="any" value="54" inputmode="decimal"><span data-unit>in</span></span>
      </label>
      <label>Spacing
        <span class="measure"><input id="gap" type="number" min="0" step="any" value="0.12" inputmode="decimal"><span data-unit>in</span></span>
      </label>
      <label>Edge
        <span class="measure"><input id="margin" type="number" min="0" step="any" value="0.25" inputmode="decimal"><span data-unit>in</span></span>
      </label>
      <label>Rotation
        <select id="rotations">
          <option value="0,90,180,270">Quarter turns</option>
          <option value="free">Any angle</option>
          <option value="0,180">Half turns</option>
          <option value="0">Keep orientation</option>
        </select>
      </label>
      <label>Units
        <select id="unit" data-current="in">
          <option value="in">Inches</option>
          <option value="mm">Millimeters</option>
          <option value="cm">Centimeters</option>
        </select>
      </label>
      <label>Max sheet length
        <span class="measure"><input id="sheet" type="number" min="0" step="any" placeholder="No limit" inputmode="decimal"><span data-unit>in</span></span>
      </label>
      <label>Existing bleed
        <span class="measure"><input id="bleed" type="number" min="0" max="25" step="0.1" value="0" inputmode="decimal"><span>mm</span></span>
      </label>
      <label>Unnamed CutContour
        <select id="generic-cut">
          <option value="">Ask me</option>
          <option value="thru">Thru-cut</option>
          <option value="kiss">Kiss-cut</option>
          <option value="contour">Generic cut</option>
        </select>
      </label>
      <label>Material $ / m²
        <input id="cost" type="number" min="0" step="any" placeholder="Optional" inputmode="decimal">
      </label>
      <label>ONYX hot folder
        <input id="hot-folder" type="text" placeholder="Optional local folder" autocomplete="off">
      </label>
    </div>
    <label class="check"><input id="allow-undo" type="checkbox"> Undo send while the file is still in the folder</label>
    <label class="check"><input id="allow-hold" type="checkbox"> Hold for Operator</label>
    <a class="workspace" href="/">Full workspace</a>
    <input id="seconds" type="hidden" value="5">
  </div>
</details>
<main>
  <div id="drop-screen">
    <label id="drop" class="drop">Drop your file
      <input id="file" type="file" accept=".svg,.pdf,.ai,image/svg+xml,application/pdf" multiple>
    </label>
  </div>
  <div id="sheet-tabs" class="tabs" hidden></div>
  <div id="sheet-frame" class="sheet-frame" hidden>
    <svg id="preview" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nested sheet"></svg>
    <svg id="live" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nest in progress" hidden></svg>
  </div>
  <p id="legend" class="key" hidden><i class="thru"></i> Thru <i class="kiss"></i> Kiss</p>
  <div class="quiet">
    <select id="material" aria-label="Material">
      <option value="vinyl-gloss" data-width="54" data-unit="in" selected>Vinyl + gloss lam · 54 in</option>
      <option value="vinyl" data-width="54" data-unit="in">Vinyl · 54 in</option>
      <option value="custom">Custom roll</option>
    </select>
    <div class="sets">
      <button id="sets-dec" type="button" aria-label="Fewer sets">−</button>
      <input id="sets" type="number" min="1" max="100" step="1" value="1" inputmode="numeric" aria-label="Sets">
      <button id="sets-inc" type="button" aria-label="More sets">+</button>
    </div>
  </div>
  <p class="metrics pending" id="readout" hidden>
    <span class="metric"><span class="label">Material used</span> <strong id="length"><span class="num">–</span><span class="unit"> ft</span></strong></span>
    <span class="metric"><span class="label">Waste</span> <strong id="waste"><span class="num">–</span><span class="unit">%</span></strong></span>
    <span class="metric"><span class="label">Sheets</span> <strong id="sheets"><span class="num">–</span></strong></span>
  </p>
  <p id="gate" class="gate" hidden><span id="checks"></span></p>
  <div id="choice" class="choice" hidden>
    <button id="choose-thru" type="button">Thru</button>
    <button id="choose-kiss" type="button">Kiss</button>
  </div>
  <button id="export" class="primary" type="button" hidden disabled>Send to ONYX</button>
  <button id="start-over" class="link" type="button" hidden>Start over</button>
  <button id="undo" class="link" type="button" hidden>Undo send</button>
  <input id="layout-id" hidden readonly tabindex="-1" aria-label="Layout ID">
  <input id="layout-hash" hidden readonly tabindex="-1" aria-label="SHA-256">
</main>
<p id="status" role="status"></p>
<script src="/svg-io.js"></script>
<script src="/queue-core.js"></script>
<script src="/cut-mapping.js"></script>
<script src="/shop-profiles.js"></script>
<script src="/web.js"></script>
</body>
</html>
